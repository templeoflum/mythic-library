<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Mapper - MiroGlyph</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/journey.css">
</head>
<body>
  <div class="journey-app">
    <!-- Header -->
    <header class="journey-header">
      <h1 class="journey-logo">Journey Mapper</h1>
      <div class="journey-nav-link">
        <a href="index.html" class="nav-link">Explorer</a>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="journey-main" class="journey-main">
      <!-- Start Screen -->
      <div id="screen-start" class="journey-screen">
        <div class="start-content">
          <h2 class="start-title">Begin Your Journey</h2>
          <p class="start-subtitle">Configure a mythic network and explore its nodes</p>

          <div class="start-actions">
            <button id="btn-new-network" class="btn btn-primary btn-large">
              New Network
            </button>
            <button id="btn-load-network" class="btn btn-secondary btn-large">
              Load Network
            </button>
            <button id="btn-surprise" class="btn btn-secondary btn-large btn-surprise">
              Surprise Me
            </button>
          </div>

          <div id="saved-networks" class="saved-journeys" hidden>
            <h3 class="section-title">Saved Networks</h3>
            <div id="saved-list" class="saved-list">
              <!-- Populated dynamically -->
            </div>
          </div>
        </div>
      </div>

      <!-- Config Screen (4-step wizard) -->
      <div id="screen-config" class="journey-screen" hidden>
        <!-- Step Indicator -->
        <div class="config-stepper">
          <div class="config-step-indicator" data-step="1">
            <span class="step-circle">1</span>
            <span class="step-label">Archetypes</span>
          </div>
          <div class="config-step-line"></div>
          <div class="config-step-indicator" data-step="2">
            <span class="step-circle">2</span>
            <span class="step-label">Motifs</span>
          </div>
          <div class="config-step-line"></div>
          <div class="config-step-indicator" data-step="3">
            <span class="step-circle">3</span>
            <span class="step-label">Entities</span>
          </div>
          <div class="config-step-line"></div>
          <div class="config-step-indicator" data-step="4">
            <span class="step-circle">4</span>
            <span class="step-label">Review</span>
          </div>
        </div>

        <!-- Config Content Area -->
        <div id="config-content" class="config-content">
          <!-- Populated dynamically per step -->
        </div>

        <!-- Config Navigation -->
        <div class="journey-nav">
          <button id="btn-config-back" class="btn btn-secondary">Back</button>
          <button id="btn-config-next" class="btn btn-primary">Next</button>
        </div>
      </div>

      <!-- Network Screen (18-node overview) -->
      <div id="screen-network" class="journey-screen" hidden>
        <div class="network-header">
          <h2 id="network-title" class="network-title">Mythic Network</h2>
          <p class="network-subtitle">18-node overview — click any node for details</p>
        </div>

        <div id="network-grid" class="network-grid">
          <!-- 3×6 grid populated dynamically -->
        </div>

        <div class="network-bottom-actions">
          <button id="btn-save-network" class="btn btn-secondary">Save Network</button>
          <button id="btn-new-network-from-network" class="btn btn-secondary">New Network</button>
        </div>
      </div>

      <!-- Save Network Modal -->
      <div id="modal-save" class="modal" hidden>
        <div class="modal-content">
          <h2>Save Network</h2>
          <form id="form-save-network">
            <div class="form-group">
              <label for="network-name">Name *</label>
              <input type="text" id="network-name-input" required placeholder="e.g., Mythic Network Alpha">
            </div>
            <div class="form-actions">
              <button type="button" id="btn-cancel-save" class="btn btn-secondary">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Node Detail Modal -->
      <div id="modal-node-detail" class="modal" hidden>
        <div class="modal-content modal-content-wide">
          <div id="node-detail-content">
            <!-- Populated dynamically -->
          </div>
          <div class="form-actions">
            <button id="btn-close-node-detail" class="btn btn-secondary">Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts: Infrastructure -->
  <script src="js/utils.js"></script>
  <script src="js/nodes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data-loader.js"></script>

  <!-- Scripts: Journey -->
  <script src="js/journey-filters.js"></script>
  <script src="js/journey-state.js"></script>
  <script src="js/journey-ui.js"></script>
  <script src="js/journey-app.js"></script>
</body>
</html>
